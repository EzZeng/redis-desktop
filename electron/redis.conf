# Redis configuration file for Redis Desktop (embedded server)
# Compatible with redis-server redis.conf directives.
#
# This file is copied to the app user data folder on first run.
# Edit the user copy — or use CONFIG SET / the Config panel in the app.

################################## NETWORK #####################################

bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################# GENERAL #####################################

daemonize no
pidfile ""
loglevel notice
logfile ""
databases 16

################################ SNAPSHOTTING ################################

# Save the DB to disk when:
#   after 900 sec (15 min) if at least 1 key changed
#   after 300 sec (5 min) if at least 10 keys changed
#   after 60 sec if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
# dir is set to the app user data folder at first launch
dir ./

################################# SECURITY ###################################

# Uncomment and set a password:
# requirepass foobared

# Example: disable FLUSHALL from clients
# rename-command FLUSHALL ""

################################### CLIENTS ####################################

maxclients 10000

############################## MEMORY MANAGEMENT ##############################

maxmemory 0
maxmemory-policy noeviction

############################## APPEND ONLY MODE ###############################

appendonly no
appendfilename "appendonly.aof"
appendfsync everysec

############################## REDIS DESKTOP ##################################

# Seed sample keys on first empty start (Redis Desktop extension)
seed-demo yes
